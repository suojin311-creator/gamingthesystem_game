<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaming the System · 音乐预览</title><style>body{max-width:760px;margin:70px auto;padding:0 26px;background:#f8f4ea;color:#34382e;font:18px/1.8 system-ui}h1{font:46px Georgia}strong{color:#ad5840}code{background:#e9dfcb;padding:3px 7px}</style><h1>Gaming the System</h1><p>完整游戏 + Design Lab · 音乐与音效预览</p><p>先解压整个 ZIP，再双击 <strong>Start-Gaming-the-System.exe</strong>。</p><p>主持页会自动打开：<strong>Open the game</strong> 开始游戏；<strong>Preview music &amp; sounds</strong> 可直接试听配乐、音效或跳到各关。</p><p>游戏结尾点 ENTER DESIGN LAB 即可进入同一课堂。多人试玩时等大家到齐，主持页再点 Start writing。</p><p>声音需首次点击后开启，右下角 Sound 可分别调整音乐和音效。</p><p>使用说明见同文件夹 README.txt。课堂期间保持程序窗口开启。</p></html>
