<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Gaming the System</title><body style="max-width:720px;margin:60px auto;background:#f8f4ea;color:#34382e;font:18px/1.8 system-ui"><h1>Gaming the System</h1><p>解压后运行 <strong>Start-Gaming-the-System.exe</strong>，自动打开游戏。</p><p>ending 的 ENTER DESIGN LAB 将打开嵌入式 Padlet。需要互联网，看板权限由 Padlet 设置决定。</p><p>程序窗口中的 /game 链接可分享给同网络玩家。无需使用旧本地课堂控制台。</p></body></html>
