<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design Lab · 独立课堂版</title><style>body{max-width:760px;margin:70px auto;padding:0 26px;background:#f8f4ea;color:#34382e;font:18px/1.8 system-ui}h1{font:46px Georgia}strong{color:#ad5840}</style><h1>Design Lab</h1><p>独立课堂版 · 音乐与音效</p><p>先完整解压 ZIP，再双击 <strong>Start-Design-Lab.exe</strong>。</p><p>浏览器自动打开主持页，将右侧链接分享给同一网络的参与者。自己预览可点击 <strong>Join as a participant</strong>。</p><p>等大家加入后，在主持页点击 <strong>Start writing</strong>。</p><p>互相投票需要至少两位投稿者；可使用另一个浏览器或隐私窗口加入。</p><p>首次点击后才会开启声音，右下角 Sound 可调整音乐和音效。</p><p>课堂期间保持程序窗口开启。完整说明见同文件夹 README.txt。</p></html>
